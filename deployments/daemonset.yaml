apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hackbox
  namespace: default
  labels:
    k8s-app: hackbox
spec:
  selector:
    matchLabels:
      app: hackbox
  template:
    metadata:
      labels:
        app: hackbox
    spec:
      # Tolerations ensure hackbox runs on every node including control-plane nodes,
      # tainted nodes, and nodes with the CriticalAddonsOnly taint.
      # Remove individual entries to exclude certain node types.
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists

      # Use hostNetwork to share the node's network namespace.
      # Enables tcpdump and connectivity checks at the node level.
      # hostNetwork: false

      containers:
      - name: hackbox
        image: ghcr.io/jzandbergen/hackbox:latest

        # privileged gives full access to the host kernel — needed for tcpdump,
        # raw sockets, etc. Remove if not required.
        securityContext:
          privileged: true

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"

        # stdin + tty are required to attach an interactive shell.
        # To attach: kubectl attach -it <pod-name>
        # List pods: kubectl get pods -l app=hackbox -o wide
        stdin: true
        tty: true
        command: ["/bin/bash"]

      terminationGracePeriodSeconds: 5
