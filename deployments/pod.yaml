apiVersion: v1
kind: Pod
metadata:
  name: hackbox
  # Add a namespace if needed, e.g. for a specific team or workload context:
  # namespace: default
spec:
  # Pin to a specific node by uncommenting and setting the node name.
  # Run `kubectl get nodes` to list available nodes.
  # nodeName: <node-name>

  # Alternatively, use nodeSelector to target nodes by label:
  # nodeSelector:
  #   kubernetes.io/hostname: <node-name>

  containers:
  - name: hackbox
    image: ghcr.io/jzandbergen/hackbox:latest

    # privileged gives full access to the host kernel — useful for tcpdump,
    # raw sockets, and other low-level debugging. Remove if not needed.
    securityContext:
      privileged: true

    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"

    # stdin + tty are required to get an interactive shell via `kubectl attach`
    stdin: true
    tty: true
    command: ["/bin/bash"]

    # Mount host network namespaces or volumes for deeper inspection, e.g.:
    # volumeMounts:
    # - name: host-root
    #   mountPath: /host
    #   readOnly: true

  # Use hostNetwork to share the node's network namespace — useful for
  # inspecting host-level traffic with tcpdump or testing node connectivity.
  # hostNetwork: false

  # volumes:
  # - name: host-root
  #   hostPath:
  #     path: /

  # Pod will not restart after you exit the shell
  restartPolicy: Never

  # Short grace period since this is an interactive debugging pod
  terminationGracePeriodSeconds: 5
